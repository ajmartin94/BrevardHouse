document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

\"Report something broken (adds to House Projects)\", checked: false },\n    ],\n    upcomingStays: [\n      { id: 1, start: \"Aug 8\", end: \"Aug 12, 2026\", isoStart: \"2026-08-08\", isoEnd: \"2026-08-12\", who: \"Andrew & Claire Hale\", people: 2, notes: \"Bringing the dog\", status: \"confirmed\" },\n      { id: 2, start: \"Aug 22\", end: \"Aug 25, 2026\", isoStart: \"2026-08-22\", isoEnd: \"2026-08-25\", who: \"Priya Nair + family\", people: 4, notes: \"\", status: \"confirmed\" },\n      { id: 3, start: \"Jul 18\", end: \"Jul 20, 2026\", isoStart: \"2026-07-18\", isoEnd: \"2026-07-20\", who: \"Marcus Boone\", people: 3, notes: \"\", status: \"pending\" },\n    ],\n    pastStays: [\n      { id: 4, start: \"Jun 14\", end: \"Jun 21, 2026\", isoStart: \"2026-06-14\", isoEnd: \"2026-06-21\", who: \"The Boone Family\", people: 5, notes: \"\" },\n      { id: 5, start: \"May 1\", end: \"May 4, 2026\", isoStart: \"2026-05-01\", isoEnd: \"2026-05-04\", who: \"Andrew Hale (solo)\", people: 1, notes: \"Deck staining trip\" },\n    ],\n    maintenanceProjects: [\n      { id: 1, title: \"Clean gutters\", status: \"not_started\", cost: \"$150\", time: \"2 hrs\", claimedBy: null, createdBy: \"Andrew Hale\", contributions: [] },\n      { id: 2, title: \"Replace HVAC filters\", status: \"in_progress\", cost: \"$40\", time: \"30 min\", claimedBy: \"Ben Okafor\", createdBy: \"Ben Okafor\", contributions: [{ by: \"Ben Okafor\", date: \"Jun 14, 2026\", note: \"Picked up 4 filters, swapped upstairs unit\" }] },\n      { id: 3, title: \"Re-stain back deck\", status: \"done\", cost: \"$310\", time: \"1 weekend\", claimedBy: \"Andrew Hale\", createdBy: \"Andrew Hale\", contributions: [{ by: \"Andrew Hale\", date: \"May 2, 2026\", note: \"Finished second coat\" }] },\n    ],\n    specialProjects: [\n      { id: 4, title: \"Convert bunk room to guest suite\", status: \"in_progress\", cost: \"$4,200 est.\", time: \"~3 weekends\", claimedBy: \"Andrew Hale\", createdBy: \"Andrew Hale\", contributions: [{ by: \"Andrew Hale\", date: \"Jun 20, 2026\", note: \"Framing done, drywall next trip\" }] },\n      { id: 5, title: \"Install hot tub on lower patio\", status: \"not_started\", cost: \"$6,500 est.\", time: \"TBD\", claimedBy: null, createdBy: \"Claire Hale\", contributions: [] },\n    ],\n    manualSections: [\n      { id: 1, title: \"Wifi & Router Reset\", content: \"Network: SourwoodHouse. Password is on the fridge whiteboard. If it's down, unplug the router in the hall closet for 30 seconds and wait a minute.\" },\n      { id: 2, title: \"Septic & Well\", content: \"Septic is pumped every 3 years (last done 2024). No wipes or grease down the drains. Well pump switch is in the crawlspace, next to the water shutoff.\" },\n      { id: 3, title: \"Emergency Contacts\", content: \"Fire/Police: 911. Property manager Dale Whitfield: 828-555-0142. Nearest ER: Transylvania Regional, ~15 min away.\" },\n      { id: 4, title: \"Appliances\", content: \"Dishwasher pods are under the sink. Propane fireplace switch is on the wall left of the mantle; tank gauge is in the side yard.\" },\n    ],\n    thingsToDo: [\n      { id: 1, category: \"Hikes\", title: \"Looking Glass Rock\", favorite: true, desc: \"6 mi round trip, big payoff view at the top\" },\n      { id: 2, category: \"Hikes\", title: \"DuPont Waterfalls Loop\", favorite: true, desc: \"Easy loop past three waterfalls\" },\n      { id: 3, category: \"Waterfalls\", title: \"High Falls\", favorite: true, desc: \"Short walk from the parking lot\" },\n      { id: 4, category: \"Waterfalls\", title: \"Triple Falls\", favorite: false, desc: \"Featured in Last of the Mohicans\" },\n      { id: 5, category: \"Restaurants\", title: \"Hobnob Kitchen\", favorite: true, desc: \"Go-to spot for dinner in town\" },\n      { id: 6, category: \"Breweries\", title: \"Oskar Blues Brevard\", favorite: false, desc: \"Big patio, dog friendly\" },\n      { id: 7, category: \"Rainy Day\", title: \"Cradle of Forestry\", favorite: false, desc: \"Museum plus a covered walking trail\" },\n    ],\n    photos: [\n      { id: 1, trip: \"Jun 2026 — Boone Family Week\", caption: \"photo: kids on the porch swing\", hue: \"#8a6f4e\", uploadedBy: \"Marcus Boone\" },\n      { id: 2, trip: \"Jun 2026 — Boone Family Week\", caption: \"photo: sunset from the deck\", hue: \"#b5673f\", uploadedBy: \"Marcus Boone\" },\n      { id: 3, trip: \"Jun 2026 — Boone Family Week\", caption: \"photo: dinner on the porch\", hue: \"#6d8560\", uploadedBy: \"Marcus Boone\" },\n      { id: 4, trip: \"May 2026 — Deck Restaining\", caption: \"photo: before — weathered deck\", hue: \"#7a6a55\", uploadedBy: \"Andrew Hale\" },\n      { id: 5, trip: \"May 2026 — Deck Restaining\", caption: \"photo: after — re-stained deck\", hue: \"#5f4632\", uploadedBy: \"Andrew Hale\" },\n      { id: 6, trip: \"Andrew's Solo Trip\", caption: \"photo: fog over the ridge\", hue: \"#5f7752\", uploadedBy: \"Andrew Hale\" },\n    ],\n    recentActivity: [\n      { who: \"Ben Okafor\", what: \"logged a contribution on HVAC filters\", when: \"2 days ago\" },\n      { who: \"Priya Nair\", what: \"suggested a check-in list edit\", when: \"3 days ago\" },\n      { who: \"Andrew Hale\", what: \"finished re-staining the back deck\", when: \"1 week ago\" },\n    ],\n    householdMembers: [\n      { name: \"Andrew Hale\", role: \"Admin\" },\n      { name: \"Claire Hale\", role: \"Member\" },\n      { name: \"Ben Okafor\", role: \"Member\" },\n      { name: \"Priya Nair\", role: \"Member\" },\n      { name: \"Marcus Boone\", role: \"Member\" },\n    ],\n  };\n\n  goHome = () => this.setState({ screen: 'home' });\n  goCheckinout = () => this.setState({ screen: 'checkinout', moreOpen: false });\n  goCalendar = () => this.setState({ screen: 'calendar', moreOpen: false });\n  goProjects = () => this.setState({ screen: 'projects', moreOpen: false });\n  goManual = () => this.setState({ screen: 'manual', moreOpen: false });\n  goThings = () => this.setState({ screen: 'things', moreOpen: false });\n  goGallery = () => this.setState({ screen: 'gallery', moreOpen: false });\n  goAccount = () => this.setState({ screen: 'account', moreOpen: false });\n  openMore = () => this.setState({ moreOpen: true });\n  closeMore = () => this.setState({ moreOpen: false });\n  stopProp = (e) => e.stopPropagation();\n\n  setMemberMode = () => this.setState({ mode: 'member' });\n  setAdminMode = () => this.setState({ mode: 'admin' });\n\n  setHomeStyleA = () => this.setState({ homeStyle: 'a' });\n  setHomeStyleB = () => this.setState({ homeStyle: 'b' });\n  setHomeStyleC = () => this.setState({ homeStyle: 'c' });\n\n  setChecklistCheckin = () => this.setState({ checklistTab: 'checkin' });\n  setChecklistCheckout = () => this.setState({ checklistTab: 'checkout' });\n  toggleCheckin = (id) => this.setState(s => ({ checkinItems: s.checkinItems.map(i => i.id === id ? { ...i, checked: !i.checked } : i) }));\n  toggleCheckout = (id) => this.setState(s => ({ checkoutItems: s.checkoutItems.map(i => i.id === id ? { ...i, checked: !i.checked } : i) }));\n  toggleChecklistEditMode = () => this.setState(s => ({ checklistEditMode: !s.checklistEditMode }));\n  updateChecklistItemText = (tab, id, text) => this.setState(s => {\n    const key = tab === 'checkin' ? 'checkinItems' : 'checkoutItems';\n    return { [key]: s[key].map(i => i.id === id ? { ...i, text } : i) };\n  });\n  deleteChecklistItem = (tab, id) => this.setState(s => {\n    const key = tab === 'checkin' ? 'checkinItems' : 'checkoutItems';\n    return { [key]: s[key].filter(i => i.id !== id) };\n  });\n  addChecklistItemToTab = () => this.setState(s => {\n    const key = s.checklistTab === 'checkin' ? 'checkinItems' : 'checkoutItems';\n    return { [key]: [...s[key], { id: Date.now(), text: \"New item — tap to edit\", checked: false }] };\n  });\n  toggleChecklistSuggestOpen = () => this.setState(s => ({ checklistSuggestOpen: !s.checklistSuggestOpen }));\n  setChecklistSuggestText = (e) => this.setState({ checklistSuggestText: e.target.value });\n  submitChecklistSuggest = () => this.setState(s => {\n    if (!s.checklistSuggestText.trim()) return null;\n    return {\n      pageSuggestions: [...s.pageSuggestions, { id: Date.now(), page: 'checkinout', tab: s.checklistTab, text: s.checklistSuggestText, submittedBy: this.currentUser() }],\n      checklistSuggestOpen: false, checklistSuggestText: '',\n    };\n  });\n\n  setProjectsMaintenance = () => this.setState({ projectsTab: 'maintenance' });\n  setProjectsSpecial = () => this.setState({ projectsTab: 'special' });\n  logContribution = (id, listKey) => this.setState(s => ({\n    [listKey]: s[listKey].map(p => p.id === id ? { ...p, contributions: [...p.contributions, { by: this.currentUser(), date: \"Today\", note: \"Checked in on this project\" }] } : p)\n  }));\n  advanceStatus = (id, listKey) => this.setState(s => ({\n    [listKey]: s[listKey].map(p => {\n      if (p.id !== id) return p;\n      const next = p.status === 'not_started' ? 'in_progress' : p.status === 'in_progress' ? 'done' : 'done';\n      return { ...p, status: next };\n    })\n  }));\n  toggleNewProjectForm = () => this.setState(s => ({ newProjectFormOpen: !s.newProjectFormOpen }));\n  setNewProjectTitle = (e) => this.setState({ newProjectTitle: e.target.value });\n  setNewProjectCost = (e) => this.setState({ newProjectCost: e.target.value });\n  setNewProjectTime = (e) => this.setState({ newProjectTime: e.target.value });\n  submitNewProject = () => this.setState(s => {\n    if (!s.newProjectTitle.trim()) return null;\n    const key = s.projectsTab === 'maintenance' ? 'maintenanceProjects' : 'specialProjects';\n    return {\n      [key]: [...s[key], { id: Date.now(), title: s.newProjectTitle, status: 'not_started', cost: s.newProjectCost || 'TBD', time: s.newProjectTime || 'TBD', claimedBy: null, createdBy: this.currentUser(), contributions: [] }],\n      newProjectFormOpen: false, newProjectTitle: '', newProjectCost: '', newProjectTime: '',\n    };\n  });\n  startEditProject = (p, listKey) => this.setState({ editingProjectId: p.id, editingProjectListKey: listKey, projectEditDraft: { title: p.title, cost: p.cost, time: p.time } });\n  cancelEditProject = () => this.setState({ editingProjectId: null, editingProjectListKey: null });\n  setProjectDraftTitle = (e) => this.setState(s => ({ projectEditDraft: { ...s.projectEditDraft, title: e.target.value } }));\n  setProjectDraftCost = (e) => this.setState(s => ({ projectEditDraft: { ...s.projectEditDraft, cost: e.target.value } }));\n  setProjectDraftTime = (e) => this.setState(s => ({ projectEditDraft: { ...s.projectEditDraft, time: e.target.value } }));\n  saveEditProject = () => this.setState(s => {\n    if (!s.editingProjectListKey) return null;\n    return {\n      [s.editingProjectListKey]: s[s.editingProjectListKey].map(p => p.id === s.editingProjectId ? { ...p, ...s.projectEditDraft } : p),\n      editingProjectId: null, editingProjectListKey: null,\n    };\n  });\n\n  toggleManual = (id) => this.setState(s => ({ openManualId: s.openManualId === id ? null : id }));\n  toggleManualEditMode = () => this.setState(s => ({ manualEditMode: !s.manualEditMode }));\n  updateManualField = (id, field, value) => this.setState(s => ({ manualSections: s.manualSections.map(sec => sec.id === id ? { ...sec, [field]: value } : sec) }));\n  deleteManualSection = (id) => this.setState(s => ({ manualSections: s.manualSections.filter(sec => sec.id !== id) }));\n  addManualSection = () => this.setState(s => {\n    const id = Date.now();\n    return { manualSections: [...s.manualSections, { id, title: \"New section\", content: \"Tap to edit…\" }] };\n  });\n  toggleManualSuggestOpen = () => this.setState(s => ({ manualSuggestOpen: !s.manualSuggestOpen }));\n  setManualSuggestText = (e) => this.setState({ manualSuggestText: e.target.value });\n  submitManualSuggest = () => this.setState(s => {\n    if (!s.manualSuggestText.trim()) return null;\n    return {\n      pageSuggestions: [...s.pageSuggestions, { id: Date.now(), page: 'manual', text: s.manualSuggestText, submittedBy: this.currentUser() }],\n      manualSuggestOpen: false, manualSuggestText: '',\n    };\n  });\n  approvePageSuggestion = (id) => this.setState(s => {\n    const sug = s.pageSuggestions.find(x => x.id === id);\n    if (!sug) return null;\n    const rest = s.pageSuggestions.filter(x => x.id !== id);\n    if (sug.page === 'checkinout') {\n      const key = sug.tab === 'checkout' ? 'checkoutItems' : 'checkinItems';\n      return { [key]: [...s[key], { id: Date.now(), text: sug.text, checked: false }], pageSuggestions: rest };\n    }\n    if (sug.page === 'manual') {\n      return { manualSections: [...s.manualSections, { id: Date.now(), title: \"Suggested update\", content: sug.text }], pageSuggestions: rest };\n    }\n    return { pageSuggestions: rest };\n  });\n  rejectPageSuggestion = (id) => this.setState(s => ({ pageSuggestions: s.pageSuggestions.filter(x => x.id !== id) }));\n\n  toggleCalendarForm = () => this.setState(s => ({ calendarFormOpen: !s.calendarFormOpen }));\n  prevCalendarMonth = () => this.setState(s => {\n    const m = s.calendarCursorMonth - 1;\n    return m < 0 ? { calendarCursorMonth: 11, calendarCursorYear: s.calendarCursorYear - 1 } : { calendarCursorMonth: m };\n  });\n  nextCalendarMonth = () => this.setState(s => {\n    const m = s.calendarCursorMonth + 1;\n    return m > 11 ? { calendarCursorMonth: 0, calendarCursorYear: s.calendarCursorYear + 1 } : { calendarCursorMonth: m };\n  });\n  buildCalendarDays(year, month, upcomingStays, pastStays) {\n    const pad = n => String(n).padStart(2, '0');\n    const firstWeekday = new Date(year, month, 1).getDay();\n    const days = [];\n    const inRange = (iso, stay) => stay.isoStart && stay.isoEnd && iso >= stay.isoStart && iso <= stay.isoEnd;\n    const allStays = [\n      ...upcomingStays.map(st => ({ ...st, kind: st.status === 'pending' ? 'pending' : 'confirmed' })),\n      ...pastStays.map(
